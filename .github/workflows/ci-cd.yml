# CI/CD — monorepo full-stack-almotos
#
# Submódulos e destinos (README):
#   almotos-backend                  FastAPI / Python 3.12 → Railway  (SoR)
#   almotos-ai                       Node 20 / MCP         → Railway  (ACL)
#   almotos-front                    Next.js 15            → Vercel   (admin)
#   almotos-catalog                  Next.js 14            → Vercel   (vitrine)
#   almotos-ai-bot                   FastAPI / Python 3.12 → Railway  (WhatsApp)
#
# Ordem de CD (dependências de runtime):
#   FastAPI SoR → almotos-ai (MCP) → [front | catalog | bot] em paralelo
#   Admin fala com o SoR; catálogo e bot falam só com almotos-ai (ADR-003).
#
# Quando roda
#   PR ........... só CI das pastas alteradas
#   push main/master ... CI + CD das pastas alteradas
#   workflow_dispatch ... opcionalmente força todos os serviços
#
# Path filter: o pai versiona Gitlinks. Alterar um submodule (ponteiro SHA)
# aparece como mudança em <pasta>/, não nos arquivos internos.
#
# Secrets / vars — ver o bloco no job "changes" e o README da conversa de setup.
# Tokens NUNCA vão para logs (GitHub mascara secrets.*).

name: CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - "almotos-backend"
      - "almotos-backend/**"
      - "almotos-front"
      - "almotos-front/**"
      - "almotos-catalog"
      - "almotos-catalog/**"
      - "almotos-ai"
      - "almotos-ai/**"
      - "almotos-ai-bot"
      - "almotos-ai-bot/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "almotos-backend"
      - "almotos-backend/**"
      - "almotos-front"
      - "almotos-front/**"
      - "almotos-catalog"
      - "almotos-catalog/**"
      - "almotos-ai"
      - "almotos-ai/**"
      - "almotos-ai-bot"
      - "almotos-ai-bot/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Ignorar path filter — CI (e CD em main/master) em todos os serviços"
        type: boolean
        default: false

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Quais pastas mudaram
  # ---------------------------------------------------------------------------
  changes:
    name: Detectar alterações
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.eval.outputs.backend }}
      front: ${{ steps.eval.outputs.front }}
      catalog: ${{ steps.eval.outputs.catalog }}
      ai: ${{ steps.eval.outputs.ai }}
      bot: ${{ steps.eval.outputs.bot }}
      workflow: ${{ steps.eval.outputs.workflow }}
    steps:
      - name: Checkout (histórico para diff; sem submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filtrar paths
        id: filter
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_all) }}
        uses: dorny/paths-filter@v3
        with:
          # Inclui o gitlink do submodule e qualquer arquivo interno.
          filters: |
            backend:
              - "almotos-backend"
              - "almotos-backend/**"
            front:
              - "almotos-front"
              - "almotos-front/**"
            catalog:
              - "almotos-catalog"
              - "almotos-catalog/**"
            ai:
              - "almotos-ai"
              - "almotos-ai/**"
            bot:
              - "almotos-ai-bot"
              - "almotos-ai-bot/**"
            workflow:
              - ".github/workflows/ci-cd.yml"

      - name: Resolver outputs
        id: eval
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
          F_BACKEND: ${{ steps.filter.outputs.backend }}
          F_FRONT: ${{ steps.filter.outputs.front }}
          F_CATALOG: ${{ steps.filter.outputs.catalog }}
          F_AI: ${{ steps.filter.outputs.ai }}
          F_BOT: ${{ steps.filter.outputs.bot }}
          F_WF: ${{ steps.filter.outputs.workflow }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "front=true"    >> "$GITHUB_OUTPUT"
            echo "catalog=true"  >> "$GITHUB_OUTPUT"
            echo "ai=true"       >> "$GITHUB_OUTPUT"
            echo "bot=true"      >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${F_BACKEND:-false}"   >> "$GITHUB_OUTPUT"
            echo "front=${F_FRONT:-false}"     >> "$GITHUB_OUTPUT"
            echo "catalog=${F_CATALOG:-false}" >> "$GITHUB_OUTPUT"
            echo "ai=${F_AI:-false}"           >> "$GITHUB_OUTPUT"
            echo "bot=${F_BOT:-false}"           >> "$GITHUB_OUTPUT"
            echo "workflow=${F_WF:-false}"       >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # CI — um job por stack. workflow.yml alterado ⇒ revalida todos.
  # ---------------------------------------------------------------------------
  ci-front:
    name: CI · almotos-front (Next.js)
    needs: changes
    if: needs.changes.outputs.front == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: almotos-front
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: almotos-front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081
        run: npm run build

  ci-catalog:
    name: CI · almotos-catalog (Next.js)
    needs: changes
    if: needs.changes.outputs.catalog == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: almotos-catalog
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: almotos-catalog/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # generateStaticParams / sitemap engolem falha de fetch; URL dummy só
      # satisfaz o guardrail de produção (ALMOTOS_AI_URL obrigatória).
      - name: Build
        env:
          ALMOTOS_AI_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          NEXT_PUBLIC_WHATSAPP_URL: https://wa.me/5500000000000
        run: npm run build

  ci-ai:
    name: CI · almotos-ai (MCP)
    needs: changes
    if: needs.changes.outputs.ai == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: almotos-ai
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: almotos-ai/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Sem script de lint no package.json — tsc strict é o gate (npm run build).
      - name: Typecheck / build
        run: npm run build

  ci-bot:
    name: CI · almotos-ai-bot (FastAPI)
    needs: changes
    if: needs.changes.outputs.bot == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: almotos-ai-bot
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: almotos-ai-bot/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Compile bytecode
        run: python -m compileall -q app

      - name: Import smoke (sem credenciais Meta)
        env:
          ALMOTOS_AI_URL: http://localhost:3100
          DEBUG: "true"
        run: python -c "from app.main import app; assert app.title"

  ci-backend:
    name: CI · almotos-backend (FastAPI SoR)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: almotos-backend
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: uv sync --frozen --group dev

      - name: Testes
        run: uv run pytest

  # Gate único para branch protection (jobs skipped não bloqueiam o PR).
  ci-gate:
    name: CI · gate
    needs: [changes, ci-backend, ci-front, ci-catalog, ci-ai, ci-bot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Avaliar resultados
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.ci-backend.result }}
          FRONT: ${{ needs.ci-front.result }}
          CATALOG: ${{ needs.ci-catalog.result }}
          AI: ${{ needs.ci-ai.result }}
          BOT: ${{ needs.ci-bot.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "Job 'changes' falhou: $CHANGES"
            exit 1
          fi
          for name_and_result in "ci-backend:$BACKEND" "ci-front:$FRONT" "ci-catalog:$CATALOG" "ci-ai:$AI" "ci-bot:$BOT"; do
            result="${name_and_result##*:}"
            name="${name_and_result%%:*}"
            case "$result" in
              success|skipped) echo "OK  $name ($result)" ;;
              *) echo "FAIL $name ($result)"; exit 1 ;;
            esac
          done

  # ---------------------------------------------------------------------------
  # CD — só push/dispatch em main|master, e só se o CI daquele serviço passou.
  #
  # Vercel: CLI oficial (mesmo fluxo de vercel/examples/ci-cd/github-actions).
  # Railway: a org railwayapp não publica `railway/cli-action` no Marketplace.
  #          O equivalente oficial é a CLI (@railway/cli) + RAILWAY_TOKEN
  #          (blog Railway / docs CLI). Flags --project/--environment/--service
  #          são obrigatórias no CLI 5.3+ com project token.
  # ---------------------------------------------------------------------------
  cd-backend:
    name: CD · almotos-backend → Railway
    needs: [changes, ci-backend]
    if: |
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.backend == 'true' &&
      needs.ci-backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_BACKEND || secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_BACKEND || secrets.RAILWAY_SERVICE_BACKEND }}
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        working-directory: almotos-backend
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?Defina RAILWAY_TOKEN (ou RAILWAY_TOKEN_BACKEND) em Settings → Secrets}"
          : "${RAILWAY_SERVICE:?Defina RAILWAY_SERVICE_BACKEND em Variables ou Secrets}"
          railway up --ci \
            ${RAILWAY_PROJECT_ID:+--project "$RAILWAY_PROJECT_ID"} \
            ${RAILWAY_ENVIRONMENT:+--environment "$RAILWAY_ENVIRONMENT"} \
            --service "$RAILWAY_SERVICE"

  cd-ai:
    name: CD · almotos-ai → Railway
    needs: [changes, ci-ai, cd-backend]
    if: |
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.ai == 'true' &&
      needs.ci-ai.result == 'success' &&
      (needs.changes.outputs.backend != 'true' || needs.cd-backend.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_AI || secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_AI || secrets.RAILWAY_SERVICE_AI }}
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        working-directory: almotos-ai
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?Defina RAILWAY_TOKEN (ou RAILWAY_TOKEN_AI) em Settings → Secrets}"
          : "${RAILWAY_SERVICE:?Defina RAILWAY_SERVICE_AI em Variables ou Secrets}"
          railway up --ci \
            ${RAILWAY_PROJECT_ID:+--project "$RAILWAY_PROJECT_ID"} \
            ${RAILWAY_ENVIRONMENT:+--environment "$RAILWAY_ENVIRONMENT"} \
            --service "$RAILWAY_SERVICE"

  cd-front:
    name: CD · almotos-front → Vercel
    needs: [changes, ci-front, cd-backend]
    if: |
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.front == 'true' &&
      needs.ci-front.result == 'success' &&
      (needs.changes.outputs.backend != 'true' || needs.cd-backend.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: almotos-front
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_FRONT || secrets.VERCEL_PROJECT_ID_FRONT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull env de produção
        run: |
          : "${VERCEL_TOKEN:?Defina VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?Defina VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Defina VERCEL_PROJECT_ID_FRONT}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (prebuilt)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy produção
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  cd-catalog:
    name: CD · almotos-catalog → Vercel
    needs: [changes, ci-catalog, cd-ai]
    if: |
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.catalog == 'true' &&
      needs.ci-catalog.result == 'success' &&
      (needs.changes.outputs.ai != 'true' || needs.cd-ai.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: almotos-catalog
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_CATALOG || secrets.VERCEL_PROJECT_ID_CATALOG }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull env de produção
        run: |
          : "${VERCEL_TOKEN:?Defina VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?Defina VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Defina VERCEL_PROJECT_ID_CATALOG}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (prebuilt)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy produção
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  cd-bot:
    name: CD · almotos-ai-bot → Railway
    needs: [changes, ci-bot, cd-ai]
    if: |
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.changes.outputs.bot == 'true' &&
      needs.ci-bot.result == 'success' &&
      (needs.changes.outputs.ai != 'true' || needs.cd-ai.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_BOT || secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_BOT || secrets.RAILWAY_SERVICE_BOT }}
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        working-directory: almotos-ai-bot
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?Defina RAILWAY_TOKEN (ou RAILWAY_TOKEN_BOT) em Settings → Secrets}"
          : "${RAILWAY_SERVICE:?Defina RAILWAY_SERVICE_BOT em Variables ou Secrets}"
          railway up --ci \
            ${RAILWAY_PROJECT_ID:+--project "$RAILWAY_PROJECT_ID"} \
            ${RAILWAY_ENVIRONMENT:+--environment "$RAILWAY_ENVIRONMENT"} \
            --service "$RAILWAY_SERVICE"
